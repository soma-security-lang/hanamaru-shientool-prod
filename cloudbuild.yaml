options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
substitutions:
  _GIT_SHA: local
  _API_BASE_URL: https://invalid.example/api/v1
  _IDENTITY_AUTH_DOMAIN: invalid.example
  _PROJECT_NUMBER: "0"
  _GOOGLE_CLIENT_ID: 000000000000-placeholder.apps.googleusercontent.com
steps:
  - name: ubuntu:24.04
    entrypoint: bash
    args: [-ceu, "mkdir -p /workspace/output"]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/api/Dockerfile, -t, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}", .]
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/worker/Dockerfile, -t, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/worker:${_GIT_SHA}", .]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [IDENTITY_PLATFORM_API_KEY, GOOGLE_PICKER_API_KEY]
    args:
      - -ceu
      - |
        docker build -f apps/web/Dockerfile \
          --build-arg="NEXT_DEPLOYMENT_ID=${_GIT_SHA}" \
          --build-arg="NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}" \
          --build-arg="NEXT_PUBLIC_IDENTITY_PLATFORM_API_KEY=$$IDENTITY_PLATFORM_API_KEY" \
          --build-arg="NEXT_PUBLIC_IDENTITY_PLATFORM_AUTH_DOMAIN=${_IDENTITY_AUTH_DOMAIN}" \
          --build-arg="NEXT_PUBLIC_IDENTITY_PLATFORM_PROJECT_ID=$PROJECT_ID" \
          --build-arg="NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=$$GOOGLE_PICKER_API_KEY" \
          --build-arg="NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER=${_PROJECT_NUMBER}" \
          --build-arg="NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}" \
          -t "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web:${_GIT_SHA}" .
  - name: anchore/syft:v1.29.0
    args: ["asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}", -o, "spdx-json=/workspace/output/sbom-api.spdx.json"]
  - name: anchore/syft:v1.29.0
    args: ["asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/worker:${_GIT_SHA}", -o, "spdx-json=/workspace/output/sbom-worker.spdx.json"]
  - name: anchore/syft:v1.29.0
    args: ["asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web:${_GIT_SHA}", -o, "spdx-json=/workspace/output/sbom-web.spdx.json"]
  - name: aquasec/trivy:0.67.2
    args: [image, --exit-code, "1", --severity, "HIGH,CRITICAL", --ignore-unfixed, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"]
  - name: aquasec/trivy:0.67.2
    args: [image, --exit-code, "1", --severity, "HIGH,CRITICAL", --ignore-unfixed, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/worker:${_GIT_SHA}"]
  - name: aquasec/trivy:0.67.2
    args: [image, --exit-code, "1", --severity, "HIGH,CRITICAL", --ignore-unfixed, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web:${_GIT_SHA}"]
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/worker:${_GIT_SHA}"
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web:${_GIT_SHA}"
artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/hanamaru-sbom/${_GIT_SHA}/"
    paths: ["output/sbom-api.spdx.json", "output/sbom-worker.spdx.json", "output/sbom-web.spdx.json"]
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/hanamaru-pilot-identity-platform-api-key/versions/latest
      env: IDENTITY_PLATFORM_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/hanamaru-pilot-picker-api-key/versions/latest
      env: GOOGLE_PICKER_API_KEY
