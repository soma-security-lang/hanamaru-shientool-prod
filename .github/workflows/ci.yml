name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11.17.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflows
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:quality-gate
      - name: PostgreSQL 16 integration and migration checksum
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pnpm test:db
      - run: pnpm test:db:roles
      - run: pnpm build
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: pnpm infra:validate
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:security
      - run: pnpm docs:validate
      - run: pnpm --filter @hanamaru/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e:offline
      - name: Upload browser and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: |
            .artifacts/offline-e2e
            test-results
            playwright-report
          retention-days: 30
