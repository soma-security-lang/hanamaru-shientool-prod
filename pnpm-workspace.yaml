packages:
  - apps/*
  - packages/*

overrides:
  fast-uri@^3.0.0: 3.1.6
  fast-uri@^4.0.0: 4.1.3
  uuid: ^11.1.1

onlyBuiltDependencies:
  - '@firebase/util'
  - '@google/genai'
  - esbuild
  - onnxruntime-node
  - protobufjs
  - unrs-resolver
allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
