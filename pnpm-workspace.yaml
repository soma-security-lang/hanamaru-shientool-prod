packages:
  - apps/*
  - packages/*

overrides:
  fast-uri@^3.0.0: 3.1.8
  fast-uri@^4.0.0: 4.1.5
  brace-expansion@^2.0.0: 2.1.7
  qs@^6.0.0: 6.16.0
  sharp: 0.35.4
  uuid: ^11.1.1
  # GHSA-m9gg-hp2v-232j: Firestore and google-gax otherwise resolve vulnerable versions.
  '@grpc/grpc-js': 1.14.5

onlyBuiltDependencies:
  - '@firebase/util'
  - '@google/genai'
  - esbuild
  - onnxruntime-node
  - protobufjs
  - unrs-resolver
allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
