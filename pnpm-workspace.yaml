packages:
  - apps/*
  - packages/*

overrides:
  fast-uri@^3.0.0: 3.1.8
  fast-uri@^4.0.0: 4.1.5
  brace-expansion@^2.0.0: 2.1.7
  fastify@^5.12.2: 5.12.6
  qs@^6.14.2: 6.16.0
  '@prisma/config@6.19.3>deepmerge-ts': 8.0.0
  '@grpc/grpc-js': 1.14.5
  sharp: 0.35.5
  source-map-js: 1.2.2
  uuid: ^11.1.1

onlyBuiltDependencies:
  - '@firebase/util'
  - '@google/genai'
  - esbuild
  - onnxruntime-node
  - protobufjs
  - unrs-resolver
allowBuilds:
  '@firebase/util': true
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false
  unrs-resolver: true
