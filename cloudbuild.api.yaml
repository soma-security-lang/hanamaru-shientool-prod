options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
substitutions:
  _GIT_SHA: local
steps:
  - name: ubuntu:24.04
    entrypoint: bash
    args: [-ceu, "mkdir -p /workspace/output"]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"
      - .
  - name: anchore/syft:v1.29.0
    args:
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"
      - -o
      - "spdx-json=/workspace/output/sbom-api.spdx.json"
  - name: aquasec/trivy:0.67.2
    args:
      - image
      - --exit-code
      - "1"
      - --severity
      - HIGH,CRITICAL
      - --ignore-unfixed
      - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/api:${_GIT_SHA}"
artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/hanamaru-sbom/${_GIT_SHA}/"
    paths: ["output/sbom-api.spdx.json"]
