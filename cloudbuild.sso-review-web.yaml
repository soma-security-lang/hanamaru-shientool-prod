options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
substitutions:
  _GIT_SHA: local
  _REVIEW_API_BASE_URL: https://sso-review-hanamaru-api-tpqjzqidwa-an.a.run.app/api/v1
  _REVIEW_SSO_ISSUER: https://sso-review-provider-tpqjzqidwa-an.a.run.app
steps:
  - name: ubuntu:24.04
    entrypoint: bash
    args: [-ceu, "mkdir -p /workspace/output"]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ '${_GIT_SHA}' =~ ^[0-9a-f]{40}$ ]]
        [[ '${_REVIEW_API_BASE_URL}' == https://sso-review-hanamaru-api-*.a.run.app/api/v1 ]]
        [[ '${_REVIEW_SSO_ISSUER}' == https://sso-review-provider-*.a.run.app ]]
        docker build --file apps/web/Dockerfile \
          --tag "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web-review:${_GIT_SHA}" \
          --build-arg "NEXT_DEPLOYMENT_ID=${_GIT_SHA}" \
          --build-arg "NEXT_PUBLIC_API_BASE_URL=${_REVIEW_API_BASE_URL}" \
          --build-arg "NEXT_PUBLIC_SSO_ISSUER=${_REVIEW_SSO_ISSUER}" \
          --build-arg 'NEXT_PUBLIC_IDENTITY_PLATFORM_API_KEY=' \
          --build-arg 'NEXT_PUBLIC_IDENTITY_PLATFORM_AUTH_DOMAIN=' \
          --build-arg 'NEXT_PUBLIC_IDENTITY_PLATFORM_PROJECT_ID=' \
          --build-arg 'NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=' \
          --build-arg 'NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER=' \
          --build-arg 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=' .
  - name: anchore/syft:v1.29.0
    args: ["asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web-review:${_GIT_SHA}", -o, "spdx-json=/workspace/output/sbom-web-review.spdx.json"]
  - name: aquasec/trivy:0.67.2
    args: [image, --exit-code, "1", --severity, HIGH,CRITICAL, --ignore-unfixed, "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web-review:${_GIT_SHA}"]
images:
  - "asia-northeast1-docker.pkg.dev/$PROJECT_ID/hanamaru-pilot/web-review:${_GIT_SHA}"
