steps:
  - name: ubuntu:24.04
    entrypoint: bash
    args: [-ceu, "mkdir -p /workspace/output"]
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv:
      - IDENTITY_PLATFORM_API_KEY
      - GOOGLE_PICKER_API_KEY
    args:
      - -euo
      - pipefail
      - -c
      - |
        docker build \
          --file apps/web/Dockerfile \
          --tag "${_IMAGE}:${_TAG}" \
          --build-arg "NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}" \
          --build-arg "NEXT_PUBLIC_IDENTITY_PLATFORM_API_KEY=$${IDENTITY_PLATFORM_API_KEY}" \
          --build-arg "NEXT_PUBLIC_IDENTITY_PLATFORM_AUTH_DOMAIN=${_AUTH_DOMAIN}" \
          --build-arg "NEXT_PUBLIC_IDENTITY_PLATFORM_PROJECT_ID=${PROJECT_ID}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=$${GOOGLE_PICKER_API_KEY}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER=${PROJECT_NUMBER}" \
          --build-arg "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}" \
          .
  - name: anchore/syft:v1.29.0
    args: ["${_IMAGE}:${_TAG}", -o, "spdx-json=/workspace/output/sbom-web.spdx.json"]
  - name: aquasec/trivy:0.67.2
    args: [image, --exit-code, "1", --severity, "HIGH,CRITICAL", --ignore-unfixed, "${_IMAGE}:${_TAG}"]
images:
  - ${_IMAGE}:${_TAG}
artifacts:
  objects:
    location: "gs://${PROJECT_ID}_cloudbuild/hanamaru-sbom/${_TAG}/"
    paths: ["output/sbom-web.spdx.json"]
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/hanamaru-pilot-identity-platform-api-key/versions/latest
      env: IDENTITY_PLATFORM_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/hanamaru-pilot-picker-api-key/versions/latest
      env: GOOGLE_PICKER_API_KEY
options:
  logging: CLOUD_LOGGING_ONLY
  requestedVerifyOption: VERIFIED
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 3600s

substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/monocle-503402/hanamaru-pilot/web
  _TAG: manual
  _API_BASE_URL: https://hanamaru-pilot-api-tpqjzqidwa-an.a.run.app/api/v1
  _AUTH_DOMAIN: monocle-503402.firebaseapp.com
  _GOOGLE_CLIENT_ID: 823274085145-pl1banjhkb1cegm01msnqtt8qb1pq9a4.apps.googleusercontent.com
